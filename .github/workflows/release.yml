name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/bundle.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/SplitPreventer-*.zip --generate-notes

      # Bump the cask on the default branch to the new version.
      - name: Update cask
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(shasum -a 256 "build/SplitPreventer-$VERSION.zip" | cut -d' ' -f1)
          git checkout "$BRANCH"
          sed -i '' -e "s/^  version \".*\"/  version \"$VERSION\"/" \
                    -e "s/^  sha256 \".*\"/  sha256 \"$SHA\"/" Casks/split-preventer.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "split-preventer $VERSION"
          git push origin "$BRANCH"
